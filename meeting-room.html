<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeetPoint — Meeting Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f8;--surf:#fff;--surf2:#e8ecf2;--line:#d7dde6;--tx:#14202e;--mut:#5d6b7d;--acc:#27c3d8;--onacc:#062b35;--red:#d83a45;--ok:#1f9d6a;--tile:#dfe5ee;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151e;--surf:#16212d;--surf2:#1f2c3b;--line:#2a3a4c;--tx:#eaf0f7;--mut:#8fa1b5;--acc:#42d4e3;--onacc:#062b35;--red:#ef4d58;--ok:#3ccf91;--tile:#1a2735}}
:root[data-theme="dark"]{--bg:#0d151e;--surf:#16212d;--surf2:#1f2c3b;--line:#2a3a4c;--tx:#eaf0f7;--mut:#8fa1b5;--acc:#42d4e3;--onacc:#062b35;--red:#ef4d58;--ok:#3ccf91;--tile:#1a2735}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:0}header{display:flex;align-items:center;gap:12px;padding:12px 16px}header h1{font-size:15px;font-weight:700;margin:0}header small{color:var(--mut);display:block;font-weight:500}.sp{flex:1}.pill{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.25}}.main{display:flex;gap:12px;padding:0 16px;min-height:0}.stage{flex:1;min-width:0;display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;min-height:0}.tile{position:relative;background:var(--tile);border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:border-color .2s,box-shadow .2s;min-height:0}.tile.speaking{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff}.tile.off .av{opacity:1}.tile:not(.off) .av{display:none}.tile:not(.off){background:linear-gradient(160deg,var(--c1),var(--c2))}.tile:not(.off)::before{content:attr(data-ini);font-size:64px;font-weight:700;color:rgba(255,255,255,.35)}.name{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:rgba(10,16,24,.72);color:#fff;border-radius:999px;padding:4px 10px 4px 8px;font-weight:600;font-size:12px;backdrop-filter:blur(6px)}.name svg{width:14px;height:14px}.hand{position:absolute;right:10px;top:10px;background:var(--acc);color:var(--onacc);border-radius:999px;padding:3px 9px;font-weight:700;font-size:12px;display:none}.tile.raised .hand{display:block}.bars{display:none;gap:2px;align-items:flex-end;height:12px}.tile.speaking .bars{display:flex}.bars i{width:3px;background:var(--acc);border-radius:2px;animation:bar .6s infinite ease-in-out}.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}@keyframes bar{0%,100%{height:3px}50%{height:12px}}.side{width:320px;background:var(--surf);border:1px solid var(--line);border-radius:16px;display:none;flex-direction:column;min-height:0}.side.open{display:flex}.tabs{display:flex;padding:6px;gap:4px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:8px;border-radius:10px;font-weight:600;color:var(--mut)}.tabs button[aria-selected=true]{background:var(--surf2);color:var(--tx)}.pane{flex:1;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px;min-height:0}.pane.on{display:flex}.msg b{font-size:12px}.msg span{color:var(--mut);font-size:11px;margin-left:6px}.msg p{margin:2px 0 0;background:var(--surf2);padding:8px 10px;border-radius:4px 12px 12px 12px;overflow-wrap:anywhere}.msg.me p{background:var(--acc);color:var(--onacc);border-radius:12px 4px 12px 12px}.msg.me{align-self:flex-end;max-width:90%}.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.send input{min-width:0;flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font:inherit}.send button{background:var(--acc);color:var(--onacc);border-radius:10px;padding:0 14px;font-weight:700}.row{display:flex;align-items:center;gap:10px;padding:4px 0}.row .s{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}.row em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}.bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;flex-wrap:wrap}.cb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:8px 6px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:600;transition:background .15s}.cb:hover{background:var(--surf2)}.cb .ic{width:44px;height:44px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx)}.cb svg{width:20px;height:20px}.cb[aria-pressed=true] .ic{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.cb.off .ic,.cb.leave .ic{background:var(--red);color:#fff;border-color:var(--red)}.cb.leave .ic{width:64px;border-radius:22px}.cb.leave{color:var(--tx)}.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:8}.toast.show{opacity:1}.end{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:10}.end.show{display:flex}.end button{background:var(--acc);color:var(--onacc);padding:10px 20px;border-radius:12px;font-weight:700}.back{font-size:12px;text-decoration:none;color:var(--mut);border:1px solid var(--line);padding:7px 10px;border-radius:999px}
@media(max-width:900px){.stage{grid-template-columns:repeat(2,minmax(0,1fr))}.side{position:fixed;inset:64px 12px 110px 12px;width:auto;z-index:5}.cb span{display:none}.cb{min-width:52px}.main{padding:0 12px}}@media(max-width:540px){header{padding:10px;gap:7px}header h1{font-size:13px}.pill{padding:6px 8px;font-size:11px}.main{padding:0 8px}.stage{gap:7px}.tile{border-radius:12px}.name{left:5px;bottom:5px;font-size:10px;padding:4px 7px}.tile:not(.off)::before{font-size:44px}.bar{gap:2px;padding:8px 4px}.cb{min-width:44px;padding:6px 4px}.cb .ic{width:40px;height:40px}.cb.leave .ic{width:48px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header><div><h1 id="meetingTitle">Weekly planning meeting<small>Meeting ID <span id="meetingId">482 916 305</span> · Demo room</small></h1></div><div class="sp"></div><a class="back" href="./index.html">MeetPoint home</a><div class="pill"><span class="dot"></span><span id="timer">00:00</span></div><div class="pill" id="count">6 people</div></header>
<div class="main"><section class="stage" id="stage" aria-label="Participants"></section><aside class="side" id="side"><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-p="chat">Chat</button><button role="tab" aria-selected="false" data-p="people">People</button></div><div class="pane on" id="chat"><div class="msg"><b>Nusrat Jahan</b><span>10:02</span><p>Good morning everyone. I'll share the schedule in a minute.</p></div><div class="msg"><b>Tanvir Hasan</b><span>10:03</span><p>Can everyone see the slides?</p></div></div><div class="pane" id="people"></div><form class="send" id="form"><input id="msgin" placeholder="Write a message" aria-label="Message" autocomplete="off"><button id="sendbtn" type="submit">Send</button></form></aside></div>
<nav class="bar" aria-label="Meeting controls"><button class="cb" id="mic" aria-label="Mute microphone"><div class="ic"></div><span>Mute</span></button><button class="cb" id="cam" aria-label="Turn off camera"><div class="ic"></div><span>Camera</span></button><button class="cb" id="share" aria-pressed="false"><div class="ic"></div><span>Share</span></button><button class="cb" id="hand" aria-pressed="false"><div class="ic"></div><span>Raise hand</span></button><button class="cb" id="chatb" aria-pressed="false"><div class="ic"></div><span>Chat</span></button><button class="cb" id="theme"><div class="ic"></div><span>Theme</span></button><button class="cb leave" id="leave" aria-label="Leave meeting"><div class="ic"></div><span>Leave</span></button></nav>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="end" id="end"><h2>You left the meeting</h2><p style="color:var(--mut);margin:0">Your meeting lasted <span id="dur"></span>.</p><button id="rejoin">Rejoin meeting</button><a class="back" href="./index.html">Return to MeetPoint</a></div>
<script>
const I={mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',micoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M3 3l18 18"/></svg>',cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3"/></svg>',camoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3M3 3l18 18"/></svg>',share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 13V8m-3 3l3-3 3 3M8 20h8"/></svg>',hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5a1.5 1.5 0 013 0v6m0-7a1.5 1.5 0 013 0v7m0-5a1.5 1.5 0 013 0v8a6 6 0 01-6 6h-1a6 6 0 01-5-3l-3-5a1.5 1.5 0 012.5-1.5L8 15"/></svg>',chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg>',theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>',leave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15c4-4 12-4 16 0l-2 3-3-1.5v-2.5c-2-.7-4-.7-6 0v2.5L6 18z"/></svg>'};
const P=[["You","Y","#3b6ea5","#223f63",1],["Nusrat Jahan","NJ","#c2566b","#7a2c45",1],["Tanvir Hasan","TH","#2f8f83","#1b5550",1],["Mehnaz Sultana","MS","#8a5fc0","#523283",0],["Arif Chowdhury","AC","#c9822b","#8a5415",1],["Sadia Islam","SI","#4f8a3c","#2f5a22",1]];
const $=id=>document.getElementById(id),st=$('stage'),ppl=$('people');let micOn=true,camOn=true,sec=0,cur=1,tm,voiceTimer;
P.forEach((p,i)=>{const t=document.createElement('div');t.className='tile'+(p[4]?'':' off');t.id='t'+i;t.dataset.ini=p[1];t.style.setProperty('--c1',p[2]);t.style.setProperty('--c2',p[3]);t.innerHTML='<div class="av" style="background:'+p[2]+'">'+p[1]+'</div><div class="hand">Hand raised</div><div class="name"><span class="bars"><i></i><i></i><i></i></span><span class="mi">'+I.mic+'</span>'+p[0]+'</div>';st.appendChild(t);ppl.insertAdjacentHTML('beforeend','<div class="row"><div class="s" style="background:'+p[2]+'">'+p[1]+'</div>'+p[0]+(i?'':' (you)')+'<em>'+(i===0?'Host':'')+'</em></div>')});
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
$('mic').firstElementChild.innerHTML=I.mic;$('cam').firstElementChild.innerHTML=I.cam;$('share').firstElementChild.innerHTML=I.share;$('hand').firstElementChild.innerHTML=I.hand;$('chatb').firstElementChild.innerHTML=I.chat;$('theme').firstElementChild.innerHTML=I.theme;$('leave').firstElementChild.innerHTML=I.leave;
function paintMe(){ $('t0').classList.toggle('off',!camOn);$('t0').querySelector('.mi').innerHTML=micOn?I.mic:I.micoff}
paintMe();
$('mic').onclick=function(){micOn=!micOn;this.classList.toggle('off',!micOn);this.lastElementChild.textContent=micOn?'Mute':'Unmute';this.firstElementChild.innerHTML=micOn?I.mic:I.micoff;paintMe();toast(micOn?'Microphone on':'Microphone muted')};
$('cam').onclick=function(){camOn=!camOn;this.classList.toggle('off',!camOn);this.firstElementChild.innerHTML=camOn?I.cam:I.camoff;paintMe();toast(camOn?'Camera on':'Camera off')};
$('share').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);this.lastElementChild.textContent=on?'Stop share':'Share';toast(on?'Demo only: screen sharing is not connected':'Screen sharing stopped')};
$('hand').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);$('t0').classList.toggle('raised',on);toast(on?'Hand raised':'Hand lowered')};
$('chatb').onclick=function(){const on=!$('side').classList.contains('open');$('side').classList.toggle('open',on);this.setAttribute('aria-pressed',on);if(on&&innerWidth<=900)document.querySelector('[data-p="chat"]').focus()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=function(){document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));['chat','people'].forEach(k=>$(k).classList.toggle('on',k===b.dataset.p));$('form').style.display=b.dataset.p==='chat'?'flex':'none'});
$('theme').onclick=function(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
function send(e){if(e)e.preventDefault();const v=$('msgin').value.trim();if(!v)return;const m=document.createElement('div');m.className='msg me';const p=document.createElement('p');p.textContent=v;m.appendChild(p);$('chat').appendChild(m);$('msgin').value='';$('chat').scrollTop=$('chat').scrollHeight}
$('form').addEventListener('submit',send);
tm=setInterval(()=>{sec++;$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000);
function cycle(){document.querySelectorAll('.tile').forEach(t=>t.classList.remove('speaking'));const choices=[1,2,4,5];cur=choices[(choices.indexOf(cur)+1)%choices.length];$('t'+cur).classList.add('speaking')}
voiceTimer=setInterval(cycle,2800);$('t1').classList.add('speaking');
function leave(){clearInterval(tm);clearInterval(voiceTimer);$('dur').textContent=$('timer').textContent;$('end').classList.add('show')}
$('leave').onclick=leave;$('rejoin').onclick=()=>location.reload();
const q=new URLSearchParams(location.search);if(q.get('title'))$('meetingTitle').childNodes[0].textContent=q.get('title');if(q.get('room'))$('meetingId').textContent=q.get('room');
</script>
</body>
</html>
